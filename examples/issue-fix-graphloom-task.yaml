# issue-fix on GraphLoom itself (dogfooding), with the graphloom profile.
# `repo: .` names the GraphLoom checkout this file lives in; intake pins that
# repository's top level, so the run's worktree is a full checkout under
# graphloom/<run-id> and its state under graphloom-state/ at the repository
# root (both ignored by Git).
# GraphLoom's issues are mostly enhancements: the profile tells the agents to
# treat one like a bug, with a new test that fails without the change.
graph: issue-fix
repo: .
config: plugins/issue-fix/profiles/graphloom.json
request: "Fix hanahmily/graphloom#119."
budgets:
  agentInvocations: 2000
  jobs: 1024
  decisions: 2048
  corrections: 16
  activeMs: 43200000
