<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-labelledby="glr-t glr-td"><title id="glr-t">How a GraphLoom run works</title><desc id="glr-td">A task.yaml selects a graph plugin. The graph defines stages. Each stage runs jobs on executors, which record evidence. Validators check the evidence; a checked stage gets a receipt, and the run moves to the next stage until done. On failure, the supervisor investigates, can repair the plugin with tested changes, and re-enters the graph. The operator decides at stop-and-ask points and before delivery.</desc><defs><marker id="glr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E7781"></path></marker><marker id="glr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"></path></marker><marker id="glr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"></path></marker></defs><rect x="0" y="0" width="1280" height="580" rx="16" fill="#FFFFFF"></rect><rect x="24" y="132" width="1232" height="300" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"></rect><text x="44" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" text-anchor="start" fill="#57606A">RUN · isolated Git worktree · pinned inputs · budgets: agent calls, jobs, time</text><path d="M166 250.0 L189 250.0" fill="none" stroke="#6E7781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-arr)"></path><path d="M318 250.0 L341 250.0" fill="none" stroke="#6E7781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-arr)"></path><path d="M470 250.0 L493 250.0" fill="none" stroke="#6E7781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-arr)"></path><path d="M622 250.0 L645 250.0" fill="none" stroke="#6E7781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-arr)"></path><path d="M774 250.0 L797 250.0" fill="none" stroke="#6E7781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-arr)"></path><path d="M926 250.0 L949 250.0" fill="none" stroke="#6E7781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-arr)"></path><path d="M1078 250.0 L1101 250.0" fill="none" stroke="#6E7781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-arr)"></path><path d="M1014.0 212 L1014.0 188 L426.0 188 L426.0 211" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-acc)"></path><text x="710.0" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#0F766E">next stage</text><rect x="40" y="214" width="124" height="72" rx="8" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5"></rect><text x="102.0" y="245.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">task.yaml</text><text x="102.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">the task</text><rect x="192" y="214" width="124" height="72" rx="8" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5"></rect><text x="254.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">graph plugin</text><text x="254.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">TypeScript</text><rect x="344" y="214" width="124" height="72" rx="8" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5"></rect><text x="406.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">stages</text><text x="406.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">e.g. Fix → Review</text><rect x="496" y="214" width="124" height="72" rx="8" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5"></rect><text x="558.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">jobs</text><text x="558.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">on executors</text><rect x="648" y="214" width="124" height="72" rx="8" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5"></rect><text x="710.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">evidence</text><text x="710.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">recorded</text><rect x="800" y="214" width="124" height="72" rx="8" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5"></rect><text x="862.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">validators</text><text x="862.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">check evidence</text><rect x="952" y="214" width="124" height="72" rx="8" fill="#E3F2EF" stroke="#0F766E" stroke-width="1.5"></rect><text x="1014.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">receipts</text><text x="1014.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">stage accepted</text><rect x="1104" y="214" width="124" height="72" rx="8" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5"></rect><text x="1166.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">done</text><text x="1166.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">local result</text><path d="M862.0 288 L862.0 358.0 L831 358.0" fill="none" stroke="#6E7781" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-arr)"></path><text x="872.0" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" fill="#57606A">failure</text><path d="M510 358.0 L386.0 358.0 L386.0 289" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-acc)"></path><text x="396.0" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#0F766E">re-enter graph</text><rect x="512" y="318" width="316" height="80" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"></rect><text x="670.0" y="343.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">Supervisor</text><text x="670.0" y="363.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">investigates · repairs plugin (tested) · re-enters</text><text x="670.0" y="381.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">stages and required outcomes stay fixed</text><path d="M518 60.0 L364 60.0 L364 211" fill="none" stroke="#57606A" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-muted)"></path><text x="376" y="52.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" fill="#57606A">stop and ask</text><path d="M762 60.0 L1166.0 60.0 L1166.0 211" fill="none" stroke="#57606A" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-muted)"></path><text x="1156.0" y="52.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="end" fill="#57606A">approve delivery</text><rect x="520" y="28" width="240" height="64" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"></rect><text x="640.0" y="55.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">Operator</text><text x="640.0" y="75.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#57606A">decides at the decision points</text><path d="M40 474 L84 474" fill="none" stroke="#6E7781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-arr)"></path><text x="96" y="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#57606A">flow of a run</text><path d="M240 474 L284 474" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-acc)"></path><text x="296" y="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#57606A">loop back into the graph</text><path d="M500 474 L544 474" fill="none" stroke="#57606A" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#glr-muted)"></path><text x="556" y="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#57606A">operator decision / failure path</text><text x="40" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#57606A">Agent claims alone do not count: a stage is accepted only when validators check its evidence.</text><text x="40" y="544" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#57606A">Nothing is pushed or posted unless you enable it.</text></svg>
