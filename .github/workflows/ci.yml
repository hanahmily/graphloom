name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Ensure workspace devDependencies (typescript, vitest) install under npm ci.
      NODE_ENV: development
      # GitHub's hosted runners have 4 CPUs; the default of 6 test workers per package starves one, and vitest then
      # fails the run with "Timeout calling onTaskUpdate" though every test passed.
      GRAPHLOOM_TEST_WORKERS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      # Supervisor-originated jobs run confined with bubblewrap (docs/design-typescript-core.md);
      # the tests that exercise the real confinement need it, and Ubuntu 24.04 runners restrict
      # the unprivileged user namespaces it uses.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc true

      - name: Install
        run: npm ci

      # Workspace packages resolve runtime from dist/; build before typecheck/test.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
