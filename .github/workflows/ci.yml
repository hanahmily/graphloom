name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # A run takes about 20 minutes (plus about 2 for the cache warm-up and the Docker coverage tests); vitest 4 has no RPC timeout, so a hung worker would otherwise hold the runner for hours.
    timeout-minutes: 45
    env:
      # Ensure workspace devDependencies (typescript, vitest) install under npm ci.
      NODE_ENV: development
      # GitHub's hosted runners have 4 CPUs; the default of 6 test workers per package would oversubscribe them.
      GRAPHLOOM_TEST_WORKERS: "3"
      # The Docker tests (pr-review coverage, sandbox pull) must run here; a missing prerequisite fails them instead of skipping.
      GRAPHLOOM_REQUIRE_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      # Supervisor-originated jobs run confined with bubblewrap (docs/design-typescript-core.md);
      # the tests that exercise the real confinement need it, and Ubuntu 24.04 runners restrict
      # the unprivileged user namespaces it uses.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc true

      - name: Install
        run: npm ci

      # Workspace packages resolve runtime from dist/; build before typecheck/test.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # pr-review's coverage sandbox is offline and reads the host's Go module and npm caches, which a fresh runner lacks.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Warm the coverage-test caches
        run: scripts/ci/warm-coverage-caches.sh

      - name: Test
        run: npm test
